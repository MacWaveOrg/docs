<!DOCTYPE html>
<html lang="en" class="lang-en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MacWave Docs</title>
    <meta name="description" content="Documents of the MacWave project, readable in the browser.">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="./">
            <span class="brand-mark">MacWave</span>
            <span class="brand-sub" data-lang="en">Docs</span>
            <span class="brand-sub" data-lang="zh">文档</span>
        </a>
        <div class="topbar-spacer"></div>
        <div class="lang-switch" role="group" aria-label="Language">
            <button class="lang-btn" type="button" data-lang-set="en">English</button>
            <button class="lang-btn" type="button" data-lang-set="zh">简体中文</button>
        </div>
        <a class="btn btn-ghost" id="repo-link" href="https://github.com/MacWaveOrg/docs" target="_blank" rel="noopener">
            <span data-lang="en">Repository</span>
            <span data-lang="zh">仓库</span>
        </a>
    </header>

    <main class="page">
        <section class="hero">
            <h1 data-lang="en">Documents</h1>
            <h1 data-lang="zh">文档</h1>
        </section>

        <div id="notice" class="notice" hidden></div>

        <div class="list doc-list" id="list" aria-live="polite"></div>

        <footer class="footer">
            <span>&copy; MacWave</span>
            <span>&middot;</span>
            <a href="https://macwave.org" target="_blank" rel="noopener">macwave.org</a>
            <span>&middot;</span>
            <a href="https://github.com/MacWaveOrg/docs" target="_blank" rel="noopener">MacWaveOrg/docs</a>
        </footer>
    </main>

    <div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-labelledby="viewer-title">
        <div class="viewer-bar">
            <span class="viewer-title" id="viewer-title"></span>
            <div class="viewer-actions">
                <span class="viewer-pages" id="viewer-pages" hidden></span>
                <a class="btn btn-ghost" id="viewer-open" href="#" target="_blank" rel="noopener">
                    <span data-lang="en">Open in new tab</span>
                    <span data-lang="zh">新标签页打开</span>
                </a>
                <a class="btn btn-ghost" id="viewer-gh" href="#" target="_blank" rel="noopener">GitHub</a>
                <button class="btn btn-primary" type="button" id="viewer-close">
                    <span data-lang="en">Close</span>
                    <span data-lang="zh">关闭</span>
                </button>
            </div>
        </div>
        <div class="viewer-body" id="viewer-body">
            <div class="pdf-pages" id="pdf-pages"></div>
            <div class="pdf-status" id="pdf-status" hidden></div>
        </div>
        <iframe class="viewer-frame" id="viewer-frame" title="PDF" hidden></iframe>
    </div>

    <script src="assets/app.js"></script>
</body>
</html>
